[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ethi-asr-bench"
version = "0.1.0"
description = "Open-source infrastructure for discovering, inspecting, and eventually benchmarking Amharic ASR models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henok Tekeba" }]
keywords = ["amharic", "asr", "speech-recognition", "benchmark", "ethiopia", "huggingface"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "huggingface-hub>=0.30.0,<2.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "rich>=13.9.0,<15.0.0",
  "typer>=0.15.0,<1.0.0",
]

[project.scripts]
ethi-asr = "ethi_asr_bench.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.14.0,<2.0.0",
  "pytest>=8.3.0,<10.0.0",
  "pytest-cov>=5.0.0,<8.0.0",
  "ruff>=0.9.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ethi_asr_bench"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "live: tests that contact the live Hugging Face Hub (skipped unless ETHI_ASR_LIVE=1)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["ethi_asr_bench"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".tmp", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Formatters own line wrapping.
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["ethi_asr_bench"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
pretty = true
